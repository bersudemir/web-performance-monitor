<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Web sitelerinin erişilebilirlik ve performans görünümü.">
  <title>{% block title %}Genel Bakış{% endblock %} · Web Performans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='/css/app.css') }}" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#main">İçeriğe geç</a>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-icon" aria-hidden="true">W</span><span>Web Performans<small>İZLEME PANELİ</small></span></a>
      <div class="nav-label">ÇALIŞMA ALANI</div>
      <nav aria-label="Ana gezinme">
        <a class="nav-item {{ 'selected' if active == 'dashboard' }}" {% if active == 'dashboard' %}aria-current="page"{% endif %} href="{{ url_for('dashboard') }}"><span aria-hidden="true">▦</span> Genel Bakış</a>
        <a class="nav-item {{ 'selected' if active == 'sites' }}" {% if active == 'sites' %}aria-current="page"{% endif %} href="{{ url_for('site_list') }}"><span aria-hidden="true">◎</span> Site Listesi</a>
        <a class="nav-item {{ 'selected' if active == 'new' }}" {% if active == 'new' %}aria-current="page"{% endif %} href="{{ url_for('site_new') }}"><span aria-hidden="true">＋</span> Site Ekle</a>
      </nav>
    </aside>
    <div class="workspace">
      <header class="topbar"><span>Web Sitesi Performans İzleme</span></header>
      <main id="main" tabindex="-1">
        {% block content %}{% endblock %}
      </main>
      <footer>Web Performans İzleme Sistemi <span>FastAPI · Akademik proje</span></footer>
    </div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
